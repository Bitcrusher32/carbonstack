schema_version: carbonstack-command-registry/v0
status: provisional
generated_for_checkpoint: v0.4.18
owner_repo: carbonstack
source_of_truth: gitea
purpose: >
  Cross-repo registry of known command, script, profile, sidecar, operator,
  and API surfaces that are easy to lose track of as CarbonStack grows.
  This registry is not a release promise and not a production security claim.

boundaries:
  - This registry is a navigation and claim-boundary artifact.
  - This registry is not a complete security model.
  - This registry is not local-backbone.
  - This registry is not release-package runtime validation.
  - This registry does not imply production readiness, production E2EE, hostile-server safety, metadata privacy, PQ/hybrid security, audit, or certification.
  - Gitea remains source of truth; GitHub mirrors are secondary push mirrors.

maturity_levels:
  release_supported: Intended release/package validation surface for the current public pre-release line.
  experimental: Implemented and useful, but still pre-release and claim-bounded.
  dev_only: Development-only helper or proof surface.
  legacy: Historical, stub-era, compatibility, or debugging surface that must not be confused with current OpenMLS runtime proof.
  internal: Internal provider/helper/API surface not intended as polished user UX.
  future: Named placeholder or documented future surface, not currently implemented.

audiences:
  public: Appropriate to mention in top-level/release-facing docs with boundaries.
  dev: Intended for operators/developers working from source.
  internal: Intended for tests, sidecars, or implementation details.
  legacy: Preserved for continuity or compatibility; not the recommended future UX.

