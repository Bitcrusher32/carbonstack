      - flag: --sidecar-device-label
        meaning: Local OpenMLS sidecar device-state label used for message protection.
      - flag: --conversation
        meaning: Local OpenMLS conversation label used for message protection.
    optional_flags:
      - flag: --state
        meaning: Local Comms state path; defaults to the normal Comms state path.
      - flag: --strict
        meaning: Block unknown, unverified, changed, or revoked trust decisions where the current dev trust surface supports them.
      - flag: --sidecar-dir
        meaning: Explicit OpenMLS sidecar project directory override.
      - flag: --message-label
        meaning: Dev/test message label carried inside the protected application message.
    nonclaims:
