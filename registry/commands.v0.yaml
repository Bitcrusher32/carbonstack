schema_version: carbonstack-command-registry/v0
status: provisional
generated_for_checkpoint: v0.6.12
owner_repo: carbonstack
source_of_truth: gitea
purpose: >
  Cross-repo registry of known command, script, profile, sidecar, operator,
  and API surfaces that are easy to lose track of as CarbonStack grows.
  This registry is not a release promise and not a production security claim.

boundaries:
  - This registry is a navigation and claim-boundary artifact.
  - This registry is not a complete security model.
  - This registry is not local-backbone.
  - This registry is not release-package runtime validation.
  - This registry does not imply production readiness, production E2EE, hostile-server safety, metadata privacy, PQ/hybrid security, audit, or certification.
  - Gitea remains source of truth; GitHub mirrors are secondary push mirrors.

maturity_levels:
  release_supported: Intended release/package validation surface for the current public pre-release line.
  experimental: Implemented and useful, but still pre-release and claim-bounded.
  dev_only: Development-only helper or proof surface.
  legacy: Historical, stub-era, compatibility, or debugging surface that must not be confused with current OpenMLS runtime proof.
  internal: Internal provider/helper/API surface not intended as polished user UX.
  future: Named placeholder or documented future surface, not currently implemented.

audiences:
  public: Appropriate to mention in top-level/release-facing docs with boundaries.
  dev: Intended for operators/developers working from source.
  internal: Intended for tests, sidecars, or implementation details.
  legacy: Preserved for continuity or compatibility; not the recommended future UX.

entries:
  - id: runner.doctor
    command: go run . --profile doctor
    repo: carbonstack
    component: tools/carbonstack-validate
    kind: runner-profile
    audience: public
    maturity: experimental
    introduced_in: pre-v0.4.x
    source_path: tools/carbonstack-validate/main.go
    validation_surface: runner self-check
    short_help: Report environment, inferred repo layout, required paths, and toolchain versions.
    why_exists: Baseline diagnostics before deeper validation.
    example: cd carbonstack/tools/carbonstack-validate && go run . --profile doctor
    optional_flags:
      - flag: --root
        meaning: optional umbrella root override; defaults to inferred parent layout where possible.
        boundary: does not install or mutate toolchains.
    nonclaims:
      - does not install or mutate toolchains
      - does not prove deployment readiness
    include_in_front_readme: true

  - id: runner.core
    command: go run . --profile core
    repo: carbonstack
    component: tools/carbonstack-validate
    kind: runner-profile
    audience: public
    maturity: experimental
    introduced_in: pre-v0.4.x
    source_path: tools/carbonstack-validate/main.go
    validation_surface: core implementation validation
    short_help: Run doctor, OpenMLS real-Cypher lifecycle test, Comms tests, Cypher tests, and artifact scans.
    why_exists: Core implementation sanity path for source checkouts and release snapshot internals.
    example: cd carbonstack/tools/carbonstack-validate && go run . --profile core --clean-generated
    optional_flags:
      - flag: --root
        meaning: optional umbrella/package root override.
        boundary: root must contain the required carbonstack, carbonstack-comms, and carbonstack-cypher paths.
      - flag: --clean-generated
        meaning: clean known generated roots after successful validation.
        boundary: only known OpenMLS sidecar generated roots are cleaned by this runner flag.
    nonclaims:
      - not deployment
      - not production security proof
    include_in_front_readme: true

