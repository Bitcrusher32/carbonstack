    short_help: Protect an OpenMLS application message and submit it through the required Relay Space-scoped Cypher route.
    why_exists: Recommended dev/pre-alpha ordinary-message send wrapper after onboarding. It requires explicit Relay Space context plus active sender and recipient device routing membership; that membership is routing authority only and is not identity, trust, or MLS authorization.
    required_flags:
