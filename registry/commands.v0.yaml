    audience: dev
    maturity: dev_only
    lifecycle_status: recommended_dev_wrapper
    introduced_in: v0.6.5
    source_path: carbonstack-comms/internal/app/message_wrappers_dev.go
    validation_surface: dev-runtime-openmls-wrappers, integrated-runtime-dev, same-state normal-message profiles, and Comms package tests
    short_help: Fetch the Relay Space-scoped device inbox, classify ordinary-message envelopes, sidecar-open supported messages, and optionally ack only after successful open.
    why_exists: Recommended dev/pre-alpha ordinary-message receive/open wrapper after onboarding. It requires explicit Relay Space context, preserves unsupported content or protocol pairs for explicit no-ack classification, and never treats routing membership as identity, trust, or MLS authorization.
    required_flags:
      - flag: --relay-space
        meaning: Relay Space ID used for scoped device-inbox fetch and any subsequent scoped acknowledgement.
        boundary: Required routing context; the command does not create the Relay Space or enroll members.
      - flag: --sidecar-device-label
        meaning: Local OpenMLS sidecar device-state label used for message open.
      - flag: --conversation
        meaning: Local OpenMLS conversation label used for message open.
    optional_flags:
      - flag: --state
        meaning: Local Comms state path; defaults to the normal Comms state path.
      - flag: --sidecar-dir
        meaning: Explicit OpenMLS sidecar project directory override.
      - flag: --message-label
        meaning: Optional application-message label filter.
      - flag: --limit
        meaning: Maximum scoped inbox records to inspect; defaults to one.
      - flag: --ack
        meaning: Request a scoped acknowledgement only after successful OpenMLS message-open.
        boundary: Fetch, unsupported skip, and message-open failure do not acknowledge the envelope.
    nonclaims:
      - dev/pre-alpha only
      - not mature inbox UX
      - not production E2EE claim
      - not hostile-server safety
      - not metadata privacy
      - not verified identity
      - not durable local receive storage
      - does not perform Relay onboarding
      - Relay membership is routing authority only
      - Relay membership is not identity, trust, or MLS authorization
      - no ack on fetch
      - no ack on unsupported content or protocol
      - no ack on message-open failure
    include_in_front_readme: true

